# Integration-test local policy.
#
# This v1beta1 policy intentionally uses a deterministic drop exception instead
# of relying on ML confidence for a particular attack string. That makes the test
# a direct proof of the container integration path:
# nginx attachment -> open-appsec agent policy decision -> nginx 403 response.
policies:
  default:
    triggers:
      - test-log-trigger
    mode: prevent
    practices:
      - test-threat-prevention-practice
    custom-response: test-block-response
    exceptions:
      - test-forced-drop
  specific-rules: []

practices:
  - name: test-threat-prevention-practice
    web-attacks:
      max-body-size-kb: 1000000
      max-header-size-bytes: 102400
      max-object-depth: 40
      max-url-size-bytes: 32768
      minimum-confidence: high
      override-mode: prevent
      protections:
        csrf-protection: inactive
        error-disclosure: inactive
        non-valid-http-methods: false
        open-redirect: inactive
    anti-bot:
      injected-URIs: []
      validated-URIs: []
      override-mode: inactive
    snort-signatures:
      configmap: []
      override-mode: inactive
    openapi-schema-validation:
      configmap: []
      override-mode: inactive

log-triggers:
  - name: test-log-trigger
    access-control-logging:
      allow-events: false
      drop-events: true
    additional-suspicious-events-logging:
      enabled: true
      minimum-severity: high
      response-body: false
      response-code: true
    appsec-logging:
      all-web-requests: false
      detect-events: true
      prevent-events: true
    extended-logging:
      http-headers: false
      request-body: false
      url-path: true
      url-query: true
    log-destination:
      cloud: false
      stdout:
        format: json

custom-responses:
  - name: test-block-response
    mode: response-code-only
    http-response-code: 403

exceptions:
  - name: test-forced-drop
    action: drop
    url:
      - /openappsec-block-test
