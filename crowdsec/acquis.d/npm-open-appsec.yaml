---
# CrowdSec AppSec listener: inline HTTP request inspection on port 7422.
# nginx sends auth_request subrequests here; AppSec returns 200 (allow) or 403 (deny).
source: appsec
listen_addr: 0.0.0.0:7422
path: /
appsec_configs:
  - crowdsecurity/appsec-default
labels:
  type: appsec
name: npm-open-appsec-appsec
