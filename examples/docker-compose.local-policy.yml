services:
  npm-open-appsec:
    # Set IMAGE_REPOSITORY (via .env or export) to the full GHCR image reference.
    image: ${IMAGE_REPOSITORY:-ghcr.io/djr747/npm-open-appsec-combined}:${NPM_IMAGE_TAG:-latest}
    container_name: npm-open-appsec
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Internal NPM listeners are rewritten to high ports so rootless Docker
      # can publish them without changing the upstream container user model.
      - NPM_HTTP_INTERNAL_PORT=${NPM_HTTP_INTERNAL_PORT:-8080}
      - NPM_HTTPS_INTERNAL_PORT=${NPM_HTTPS_INTERNAL_PORT:-8443}
      # No AGENT_TOKEN in local-policy mode - the agent runs fully offline.
      # autoPolicyLoad=true causes the agent to reload policy from /ext/appsec whenever
      # local_policy.yaml changes, without requiring a restart.
      - autoPolicyLoad=true
      # NOTE: no extra sidecar containers (smartsync, shared-storage, tuning-svc, db) are
      # needed for this setup. Those are only required for the unsupervised local-policy ML
      # suggestion loop (adaptive tuning without a cloud backend). A static local_policy.yaml
      # with autoPolicyLoad gives full WAF enforcement without them. If you later want the ML
      # tuning loop, refer to the NPMplus compose.yaml for the full optional setup.
    ports:
      - "${NPM_HTTP_PORT:-8080}:${NPM_HTTP_INTERNAL_PORT:-8080}"
      - "${NPM_ADMIN_PORT:-8181}:81"
      - "${NPM_HTTPS_PORT:-8443}:${NPM_HTTPS_INTERNAL_PORT:-8443}"
    volumes:
      - /opt/npm/data:/data
      - /opt/npm/letsencrypt:/etc/letsencrypt
      # Place local_policy.yaml under /opt/openappsec/localconfig before starting the container.
      # Download a starter file:
      #   curl -fsSL https://raw.githubusercontent.com/openappsec/open-appsec-npm/main/deployment/local_policy.yaml \
      #        -o /opt/openappsec/localconfig/local_policy.yaml
      - /opt/openappsec/localconfig:/ext/appsec
      - /opt/openappsec/conf:/etc/cp/conf
      - /opt/openappsec/data:/etc/cp/data
      - /opt/openappsec/logs:/var/log/nano_agent
      # Optional: pre-trained advanced ML model for improved detection accuracy.
      # Download open-appsec-advanced-model.tgz from the open-appsec GitHub releases
      # and place it at the host path below before starting the container.
      # The startup script automatically extracts it into /etc/cp/conf/waap.
      # - /opt/openappsec/open-appsec-advanced-model.tgz:/advanced-model/open-appsec-advanced-model.tgz
