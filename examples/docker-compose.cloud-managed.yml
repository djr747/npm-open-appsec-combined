services:
  npm-open-appsec:
    # Set IMAGE_REPOSITORY (via .env or export) to the full GHCR image reference.
    image: ${IMAGE_REPOSITORY:-ghcr.io/djr747/npm-open-appsec-combined}:${NPM_IMAGE_TAG:-latest}
    container_name: npm-open-appsec
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Internal NPM listeners are rewritten to high ports so rootless Podman
      # can publish them without host sysctl tweaks.
      - NPM_HTTP_INTERNAL_PORT=${NPM_HTTP_INTERNAL_PORT:-8080}
      - NPM_HTTPS_INTERNAL_PORT=${NPM_HTTPS_INTERNAL_PORT:-8443}
      # Cloud-managed policy: set APPSEC_AGENT_TOKEN.
      # Local policy mode: leave APPSEC_AGENT_TOKEN empty and provide local_policy.yaml in /opt/openappsec/localconfig.
      - AGENT_TOKEN=${APPSEC_AGENT_TOKEN:-}
      - user_email=${APPSEC_USER_EMAIL:-}
      # Optional:
      - https_proxy=${APPSEC_HTTPS_PROXY:-}
      - autoPolicyLoad=${APPSEC_AUTO_POLICY_LOAD:-true}
      # CrowdSec — fully declarative, no file copies and no NPM UI edits required.
      # This example includes the crowdsec service below. Set CROWDSEC_ENABLED=false
      # if you want to keep cloud-managed open-appsec only.
      - CROWDSEC_ENABLED=${CROWDSEC_ENABLED:-true}
      - CROWDSEC_APPSEC_URL=${CROWDSEC_APPSEC_URL:-crowdsec:7422}
      # Optional: comma-separated hostnames to exclude from CrowdSec checks.
      # On first start the startup script writes these into /data/nginx/custom/http_top.conf.
      # To edit later, manually update the generated map block in that file.
      - CROWDSEC_SKIP_HOSTS=${CROWDSEC_SKIP_HOSTS:-}
    ports:
      - "${NPM_HTTP_PORT:-8080}:${NPM_HTTP_INTERNAL_PORT:-8080}"
      - "${NPM_ADMIN_PORT:-8181}:81"
      - "${NPM_HTTPS_PORT:-8443}:${NPM_HTTPS_INTERNAL_PORT:-8443}"
    volumes:
      # Shared with CrowdSec's read-only log mount below, so this path uses a shared SELinux label.
      - /opt/npm/data:/data:z,U
      - /opt/npm/letsencrypt:/etc/letsencrypt:Z,U
      - /opt/openappsec/localconfig:/ext/appsec:Z,U
      - /opt/openappsec/conf:/etc/cp/conf:Z,U
      - /opt/openappsec/data:/etc/cp/data:Z,U
      - /opt/openappsec/logs:/var/log/nano_agent:Z,U
      # Optional: pre-trained advanced ML model for improved detection accuracy.
      # Download open-appsec-advanced-model.tgz from the open-appsec GitHub releases
      # and place it at the host path below before starting the container.
      # The startup script automatically extracts it into /etc/cp/conf/waap.
      - /opt/openappsec/open-appsec-advanced-model.tgz:/advanced-model/open-appsec-advanced-model.tgz:ro,Z
  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest
    container_name: crowdsec
    profiles:
      - crowdsec
    # Run CrowdSec with Podman's default rootless mapping.
    # Do not force a separate container user here; podman-compose runs this
    # service in a pod, and extra userns overrides break that startup path.
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - GID=${PGID:-1000}
      - USE_WAL=true
      # CrowdSec AppSec runs inline over port 7422; no extra bouncer sidecar needed.
      - COLLECTIONS=crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      # Optional CrowdSec Console enrollment.
      # Set CROWDSEC_ENROLL_KEY to register this instance to your CrowdSec account.
      - ENROLL_KEY=${CROWDSEC_ENROLL_KEY:-}
      - ENROLL_INSTANCE_NAME=${CROWDSEC_ENROLL_INSTANCE_NAME:-npm-open-appsec}
    volumes:
      # Keep CrowdSec state in a host path (same pattern as other services).
      - /opt/crowdsec/data:/var/lib/crowdsec/data:Z,U
      # Declarative acquisition config (downloaded into /opt/crowdsec/acquis.d).
      - /opt/crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro,Z
      # NPM per-host access logs: /opt/npm/data/logs/proxy-host-*_access.log
      # Shared SELinux label keeps CrowdSec and NPM able to read the same tree.
      - /opt/npm/data/logs:/var/log/npm:ro,z
