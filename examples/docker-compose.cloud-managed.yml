services:
  npm-open-appsec:
    # Set IMAGE_REPOSITORY (via .env or export) to your GHCR owner/repo path.
    image: ghcr.io/${IMAGE_REPOSITORY:-djr747/npm-open-appsec-combined}:${NPM_IMAGE_TAG:-latest}
    container_name: npm-open-appsec
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Cloud-managed policy: set APPSEC_AGENT_TOKEN.
      # Local policy mode: leave APPSEC_AGENT_TOKEN empty and provide local_policy.yaml in ./appsec/localconfig.
      - AGENT_TOKEN=${APPSEC_AGENT_TOKEN:-}
      - user_email=${APPSEC_USER_EMAIL}
      # Optional:
      - https_proxy=${APPSEC_HTTPS_PROXY:-}
      - autoPolicyLoad=${APPSEC_AUTO_POLICY_LOAD:-true}
      # CrowdSec — fully declarative, no file copies and no NPM UI edits required.
      - CROWDSEC_ENABLED=${CROWDSEC_ENABLED:-true}
      - CROWDSEC_APPSEC_URL=crowdsec:7422
      # Optional: comma-separated hostnames to exclude from CrowdSec checks.
      # On first start the startup script writes these into /data/nginx/custom/http_top.conf.
      # To edit later, manually update the generated map block in that file.
      - CROWDSEC_SKIP_HOSTS=${CROWDSEC_SKIP_HOSTS:-}
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./appsec/localconfig:/ext/appsec
      - ./appsec/conf:/etc/cp/conf
      - ./appsec/data:/etc/cp/data
      - ./appsec/logs:/var/log/nano_agent
      # Optional: pre-trained advanced ML model for improved detection accuracy.
      # Download open-appsec-advanced-model.tgz from the open-appsec GitHub releases
      # and place it at the host path below before starting the container.
      # The startup script automatically extracts it into /etc/cp/conf/waap.
      # - ./appsec/open-appsec-advanced-model.tgz:/advanced-model/open-appsec-advanced-model.tgz
    depends_on:
      - crowdsec

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mkdir -p /etc/crowdsec/acquis.d
        # CrowdSec acquis.d accepts multi-document YAML, so the `---` separator below
        # intentionally keeps the nginx log reader and the AppSec listener in one
        # bootstrap file and avoids mounting extra config files just for this example.
        cat >/etc/crowdsec/acquis.d/npm-open-appsec.yaml <<'EOF'
        filenames:
          - /var/log/npm/proxy-host-*_access.log
        labels:
          type: nginx
        ---
        listen_addr: 0.0.0.0:7422
        appsec_config: crowdsecurity/appsec-default
        source: appsec
        labels:
          type: appsec
        EOF
        exec /docker_start.sh
    environment:
      - TZ=${TZ:-UTC}
      - USE_WAL=true
      - COLLECTIONS=crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - ./data/logs:/var/log/npm:ro

volumes:
  crowdsec_config:
  crowdsec_data:
