services:
  npm-open-appsec:
    image: ghcr.io/${IMAGE_REPOSITORY:-djr747/npm-open-appsec-combined}:${NPM_IMAGE_TAG:-latest}
    container_name: npm-open-appsec
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # open-appsec (cloud-managed by default; leave AGENT_TOKEN empty to switch to local policy mode)
      - AGENT_TOKEN=${APPSEC_AGENT_TOKEN:-}
      - user_email=${APPSEC_USER_EMAIL:-}
      - registered_server=NGINX
      - nginxproxymanager=true
      - autoPolicyLoad=${APPSEC_AUTO_POLICY_LOAD:-true}
      # CrowdSec — fully declarative, no file copies and no NPM UI edits required.
      - CROWDSEC_ENABLED=true
      # bouncer (default) = CrowdSec IP reputation / ban decisions
      # appsec            = CrowdSec AppSec header inspection on port 7422
      - CROWDSEC_AUTH_MODE=${CROWDSEC_AUTH_MODE:-bouncer}
      - CROWDSEC_BOUNCER_URL=crowdsec-bouncer:8080
      - CROWDSEC_APPSEC_URL=crowdsec:7422
      # Optional: comma-separated hostnames to exclude from CrowdSec checks.
      # On first start the startup script writes these into /data/nginx/custom/http_top.conf.
      # To edit later, manually update the generated map block in that file.
      - CROWDSEC_SKIP_HOSTS=${CROWDSEC_SKIP_HOSTS:-}
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./appsec/localconfig:/ext/appsec
      - ./appsec/conf:/etc/cp/conf
      - ./appsec/data:/etc/cp/data
      - ./appsec/logs:/var/log/nano_agent
      # Optional: pre-trained advanced ML model for improved detection accuracy.
      # - ./appsec/open-appsec-advanced-model.tgz:/advanced-model/open-appsec-advanced-model.tgz
    depends_on:
      - crowdsec
      - crowdsec-bouncer

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mkdir -p /etc/crowdsec/acquis.d
        cat >/etc/crowdsec/acquis.d/npm-open-appsec.yaml <<'EOF'
        filenames:
          - /var/log/npm/proxy-host-*_access.log
        labels:
          type: nginx
        ---
        listen_addr: 0.0.0.0:7422
        appsec_config: crowdsecurity/appsec-default
        source: appsec
        labels:
          type: appsec
        EOF
        exec /docker_start.sh
    environment:
      - TZ=${TZ:-UTC}
      - USE_WAL=true
      # Includes nginx log parsing plus CrowdSec AppSec virtual-patching rules.
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/linux crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      # CrowdSec automatically registers any env var matching BOUNCER_KEY_<name>.
      - BOUNCER_KEY_NPM_OPEN_APPSEC=${CROWDSEC_BOUNCER_API_KEY:-change-this-long-random-value}
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      # NPM per-host access logs: /data/logs/proxy-host-*_access.log
      - ./data/logs:/var/log/npm:ro

  crowdsec-bouncer:
    image: docker.io/fbonalair/traefik-crowdsec-bouncer:latest
    container_name: crowdsec-bouncer
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY:-change-this-long-random-value}
      - CROWDSEC_AGENT_HOST=crowdsec:8080
      - GIN_MODE=release
    depends_on:
      - crowdsec

volumes:
  crowdsec_config:
  crowdsec_data:
