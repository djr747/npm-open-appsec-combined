# CrowdSec bouncer wiring for NGINX Proxy Manager — http-level snippet
# ======================================================================
# Drop this file at: ./data/nginx/custom/http_top.conf
# (create the directory first if it does not exist: mkdir -p ./data/nginx/custom)
#
# This file is included inside nginx's http{} block by NPM. It provides:
#   1. The upstream block pointing at the crowdsec-bouncer container.
#   2. A map that lets you exclude specific virtual-host names from CrowdSec checks.
#
# ENABLING PER-PROXY-HOST PROTECTION
#   nginx's auth_request directive must live inside a server{} or location{} block.
#   Because NPM generates server blocks automatically, you add it per-proxy-host via
#   NPM's "Advanced" configuration textarea in the UI. Copy the contents of
#   crowdsec-snippets/proxy-host-advanced.conf into that textarea for each host
#   you want to protect.
#
# EXCLUDING SPECIFIC HOSTS
#   Because auth_request is added per-proxy-host via NPM's "Advanced" config
#   (see crowdsec-snippets/proxy-host-advanced.conf), the simplest way to exclude
#   a host is to not add the snippet to that host. No changes to this file needed.
#
#   The map block below is included for reference and is pre-populated by the
#   start-openappsec-agent startup script when CROWDSEC_SKIP_HOSTS is set (see
#   docker-compose.crowdsec.yml). It can also serve as documentation of which
#   hosts are intentionally excluded from CrowdSec protection.
#
# CROWDSEC APPSEC (optional — WAF header inspection on top of IP reputation)
#   CrowdSec AppSec listens on port 7422 and inspects request headers against
#   virtual-patching and generic attack rules. To enable it, uncomment the
#   crowdsec_appsec upstream block and use the AppSec auth_request location in
#   proxy-host-advanced.conf instead of (or in addition to) the IP-only one.
#
#   Limitation: nginx's auth_request does not forward the request body to the
#   subrequest, so AppSec header-based rules apply (URL/header injection, etc.)
#   but POST-body inspection is not available via this method. The Lua-based
#   bouncer supports full body inspection but requires an OpenResty/Lua nginx build.

# Map documenting which hosts are intentionally excluded from CrowdSec protection.
# Value 1 = excluded; default 0 = protected (add auth_request snippet in NPM Advanced config).
# This map is pre-populated by the startup script from CROWDSEC_SKIP_HOSTS.
# It is not referenced by any active nginx directive — its purpose is documentation.
map $host $crowdsec_skip {
    default 0;

    # Add entries here to exclude specific hosts from CrowdSec IP-ban checks:
    # "internal.example.com"    1;
    # "webhook.example.com"     1;
    # "health.example.com"      1;
}

# Upstream: crowdsec-bouncer HTTP forwardAuth service (IP ban checks).
# Container name must match the service name in docker-compose.crowdsec.yml.
upstream crowdsec_bouncer {
    server crowdsec-bouncer:8080;
    keepalive 32;
}

# Optional upstream: CrowdSec AppSec endpoint (header-based WAF inspection).
# Requires crowdsecurity/appsec-virtual-patching and crowdsecurity/appsec-generic-rules
# collections to be installed inside the crowdsec container.
# Uncomment when AppSec is configured and the acquis.d AppSec listener is active.
# upstream crowdsec_appsec {
#     server crowdsec:7422;
#     keepalive 32;
# }
