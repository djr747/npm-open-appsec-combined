# CrowdSec per-proxy-host Advanced config snippet
# ================================================
# Paste this into the "Advanced" configuration textarea in NPM's proxy host edit form
# for each host you want to protect with CrowdSec.
#
# REQUIREMENTS:
#   - examples/crowdsec-snippets/http_top.conf must be in place at
#     ./data/nginx/custom/http_top.conf (provides the upstream + map).
#   - The crowdsec-bouncer container must be running and reachable.
#
# HOW IT WORKS:
#   nginx sends a lightweight subrequest to the crowdsec-bouncer's forwardAuth
#   endpoint for each inbound request. The bouncer checks the client IP against
#   CrowdSec's local decision database and returns:
#     200 — IP is clean, request proceeds normally.
#     403 — IP is banned, the @crowdsec_deny named location returns a 403.
#
# EXCLUDING A HOST FROM CROWDSEC:
#   Simply do not add this snippet to that host's "Advanced" config in NPM.
#   auth_request is opt-in per proxy host — any host without this snippet is
#   not checked by CrowdSec.
#
# CROWDSEC APPSEC (optional — header-based WAF rules):
#   Replace the auth_request line below with the commented-out AppSec alternative
#   to send header details to CrowdSec's AppSec engine (port 7422).
#   Both the IP check and the AppSec check can be active simultaneously by using
#   two auth_request directives (nginx evaluates them in sequence).

# Internal subrequest location: proxies to the crowdsec-bouncer forwardAuth endpoint.
# Returns 200 (allow) or 403 (ban). Request body is not forwarded (IP check only).
location = /crowdsec-check {
    internal;
    proxy_pass http://crowdsec_bouncer/api/v1/forwardAuth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-URI $request_uri;
    proxy_set_header X-Forwarded-Method $request_method;
}

# Optional: CrowdSec AppSec subrequest location (header-based WAF inspection).
# Forwards request headers (not body) to CrowdSec AppSec on port 7422.
# Requires crowdsecurity/appsec-virtual-patching and crowdsecurity/appsec-generic-rules
# collections installed, and the AppSec listener active in acquis.d.
# Uncomment crowdsec_appsec upstream in http_top.conf before enabling this.
# location = /crowdsec-appsec {
#     internal;
#     proxy_pass http://crowdsec_appsec/;
#     proxy_pass_request_body off;
#     proxy_set_header Content-Length "";
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_set_header X-Forwarded-Host $host;
#     proxy_set_header X-Forwarded-URI $request_uri;
#     proxy_set_header X-Forwarded-Method $request_method;
# }

# IP ban check: nginx sends a subrequest to the bouncer for every request.
auth_request /crowdsec-check;

# Uncomment to use AppSec header inspection instead of (or in addition to) the IP check:
# auth_request /crowdsec-appsec;

# Return a plain 403 for banned IPs or AppSec blocks.
error_page 401 403 = @crowdsec_deny;
location @crowdsec_deny {
    return 403 "Access denied.\n";
}
