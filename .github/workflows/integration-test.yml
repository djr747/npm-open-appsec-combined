name: Integration test

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  single-container-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t local/npm-open-appsec:integration .

      - name: Run single-container startup integration test
        env:
          IMAGE_NAME: local/npm-open-appsec:integration
          SKIP_BUILD: "1"
          TEST_ARTIFACTS_DIR: ${{ github.workspace }}/test-artifacts
          KEEP_TEST_ARTIFACTS: "1"
        run: ./scripts/test-single-container-startup.sh

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: test-artifacts
