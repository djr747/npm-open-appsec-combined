name: Integration test

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  single-container-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image
        run: docker build -t local/npm-open-appsec:integration .

      - name: Run single-container startup integration test
        env:
          IMAGE_NAME: local/npm-open-appsec:integration
          SKIP_BUILD: "1"
        run: ./scripts/test-single-container-startup.sh
