# Integration-test local policy: prevent mode with high-confidence web-attack blocking.
#
# Used by scripts/test-single-container-startup.sh to verify that the open-appsec
# attachment module actively blocks high-confidence attacks (e.g. SQL injection)
# and returns HTTP 403 before the request reaches the upstream backend.
#
# This file is copied over local_policy.yaml in the test volume after all services
# have started. autoPolicyLoad=true causes the agent to reload the policy automatically.
policies:
  default:
    triggers:
      - appsec-default-log-trigger
    mode: prevent
    practices:
      - webapp-prevent-practice
    custom-response: appsec-default-web-user-response
  specific-rules: []

practices:
  - name: webapp-prevent-practice
    web-attacks:
      max-body-size-kb: 1000000
      max-header-size-bytes: 102400
      max-object-depth: 40
      max-url-size-bytes: 32768
      minimum-confidence: high
      override-mode: prevent
      protections:
        csrf-protection: inactive
        error-disclosure: inactive
        non-valid-http-methods: false
        open-redirect: inactive
    anti-bot:
      injected-URIs: []
      validated-URIs: []
      override-mode: inactive
    snort-signatures:
      configmap: []
      override-mode: inactive
    openapi-schema-validation:
      configmap: []
      override-mode: inactive

log-triggers:
  - name: appsec-default-log-trigger
    access-control-logging:
      allow-events: false
      drop-events: true
    additional-suspicious-events-logging:
      enabled: true
      minimum-severity: high
      response-body: false
      response-code: true
    appsec-logging:
      all-web-requests: false
      detect-events: true
      prevent-events: true
    extended-logging:
      http-headers: false
      request-body: false
      url-path: true
      url-query: true
    log-destination:
      cloud: false
      stdout:
        format: json

custom-responses:
  - name: appsec-default-web-user-response
    mode: response-code-only
    http-response-code: 403
